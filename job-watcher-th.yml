name: job-watcher-th

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-watcher-th
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll Thai jobs and send new ones to Discord
        env:
          DISCORD_WEBHOOK_URL_TH: ${{ secrets.DISCORD_WEBHOOK_URL_TH }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: python job_watcher_th.py
      - name: Save seen jobs
        run: |
          git config user.name "job-watcher"
          git config user.email "job-watcher@users.noreply.github.com"
          git add seen_jobs_th.json
          if ! git diff --cached --quiet; then
            git commit -m "update seen jobs (th)"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs && git push && exit 0
              sleep 5
            done
            exit 1
          fi
